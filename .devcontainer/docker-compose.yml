services:
  # Main development container for YAPAY SDK with integrated server
  yapay-sdk-dev:
    image: metalmon/yapay:dev
    volumes:
      - ..:/workspace:cached
      # Mount the Docker socket to allow running Docker commands from within the container (Docker-out-of-Docker)
      - /var/run/docker.sock:/var/run/docker.sock
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/home/yapay/.cache/go-build
    environment:
      # Pass the host project path to the container, so it can be used for Docker-out-of-Docker volume mounts.
      - HOST_PROJECT_PATH=${PWD}
      - GO111MODULE=on
      - GOPROXY=https://proxy.golang.org,direct
      - GOSUMDB=sum.golang.org
      - CGO_ENABLED=1
      - LOG_LEVEL=debug
      - YANDEX_SANDBOX_MODE=true
      # Server Configuration
      - PORT=8080
      - GIN_MODE=debug
      # Metrics Configuration
      - METRICS_PORT=8081
      - METRICS_REQUIRE_AUTH=false
      # Development
      - TERM=xterm-256color
      - COLORTERM=truecolor
    ports:
      - "8080:8080"  # YAPAY server API (includes /metrics endpoint)
      - "2345:2345"  # Delve debugger port
    command: sleep infinity
    networks:
      - yapay-sdk-development-network

  # WireMock for Yandex Pay API mocking
  wiremock:
    image: wiremock/wiremock:2.35.0
    container_name: yandex-pay-mock
    ports:
      - "8083:8080"  # WireMock API
    volumes:
      - ../wiremock:/home/wiremock
    command: ["--global-response-templating", "--verbose"]
    networks:
      - yapay-sdk-development-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  go-mod-cache:
  go-build-cache:

networks:
  yapay-sdk-development-network:
    driver: bridge