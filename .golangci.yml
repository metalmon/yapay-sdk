run:
  timeout: 5m

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  unused:
    check-exported: false
  gocyclo:
    min-complexity: 12  # Более строгий лимит сложности
  dupl:
    threshold: 80      # Более строгий лимит дублирования
  goconst:
    min-len: 2
    min-occurrences: 2
  misspell:
    locale: US
  lll:
    line-length: 120   # Более строгий лимит длины строки
  funlen:
    lines: 80          # Более строгий лимит для функций
    statements: 40     # Более строгий лимит для операторов
  dogsled:
    max-blank-identifiers: 2  # Максимум 2 пустых идентификатора в списке параметров
  prealloc:
    simple: true       # Простые случаи предварительной аллокации
    range-loops: true  # Циклы range
    for-loops: false   # Обычные for циклы (может быть слишком агрессивно)
  revive:
    rules:
      - name: exported
        disabled: false
        arguments:
          - disableStutteringCheck
      - name: package-comments
        disabled: false
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - dupImport # https://github.com/go-critic/go-critic/issues/845
      - octalLiteral
      - whyNoLint
      # ifElseChain и wrapperFunc включены для лучшего качества кода

linters:
  enable:
    - errcheck
    - unused
    - govet
    - gocyclo
    - dupl
    - goconst
    - misspell
    - lll
    - funlen
    - gocritic
    - gofmt
    - goimports
    - gosec
    - gosimple
    - ineffassign
    - staticcheck
    - typecheck
    - bodyclose      # Проверка закрытия HTTP body
    - dogsled        # Проверка длинных списков параметров
    - gochecknoinits # Запрет init() функций
    - prealloc       # Оптимизация аллокаций
    - revive         # Современная альтернатива golint

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
        - funlen      # Тесты могут быть длиннее
        - bodyclose   # В тестах не всегда нужно закрывать body
        - dogsled     # В тестах допустимы длинные списки параметров
